{% extends 'base.html' %}{% block title %}BA Signup{% endblock %}{% block content %}<section class="auth card"><h1>BA registration</h1><p class="muted">Verify your email address. Admin approval is required before login.</p><form method="post"><label>Username</label><input name="username" minlength="3" required autocomplete="username"><label>Google account / email address</label><input name="email" type="email" placeholder="you@gmail.com" required autocomplete="email"><label>Password (10+ characters)</label><input type="password" name="password" minlength="10" required autocomplete="new-password"><button class="primary full">Send email verification code</button></form><p><a href="{{ url_for('login') }}">Back to login</a></p></section>{% endblock %}
